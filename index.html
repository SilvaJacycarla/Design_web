<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 10: Orientação a Objetos</title>
</head>
<body>
    <h3>Data:09/10/2026</h3>
    <table>
        <tr>
            <th>Cachorro</th>
            <th>Ações</th>
        </tr>
        <tr>
            <td>Balu</td>
            <td>
                <button onclick="balu.falar();">Latir</button>
                <button onclick="balu.comer(0.5);">Comer</button>
                <button onclick="balu.cagar(0.3);">Cagar</button>
                <button onclick="balu.saudar();">Saudar</button>
            </td>
        </tr>
        <tr>
            <td>Mel</td>
            <td>
                <button onclick="mel.falar();">Latir</button>
                <button onclick="mel.comer(0.5);">Comer</button>
                <button onclick="mel.cagar(0.3);">Cagar</button>
                <button onclick="mel.saudar();">Saudar</button>
            </td>
        </tr>
        <tr>
            <td>Leleco</td>
            <td>
                <button onclick="leleco.falar();">Latir</button>
                <button onclick="leleco.comer(0.05);">Comer</button>
                <button onclick="leleco.cagar(0.01);">Cagar</button>
                <button onclick="leleco.saudar();">Saudar</button>
            </td>
        </tr>
    </table>
    <script src="./js/app2.js"></script>
</body>
</html>
